name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Optional: add a PAT (scopes: repo, read:user) as secret GRS_TOKEN to include private contributions.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&theme=tokyonight&bg_color=0b1e4d&title_color=22d3ee&icon_color=38bdf8"
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=tokyonight&bg_color=0b1e4d&title_color=22d3ee"
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0b1e4d,#1e40af,#38bdf8,#22d3ee

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
